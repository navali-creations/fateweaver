name: Release

on:
  push:
    branches:
      - main
    paths:
      - "packages/poe1-divination-cards/**"
      - ".releaserc.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:
  schedule:
    # Avoid the start-of-hour load, when GitHub can delay or drop scheduled runs.
    - cron: "17 5 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  update:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release: ${{ steps.commit.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Find the active league
        id: league
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";

          const response = await fetch("https://wraeclast-cards.pages.dev/data/drop-rates/index.json", {
            headers: {
              Accept: "application/json",
              "User-Agent": "fateweaver/0.0.0 (https://github.com/navali-creations/fateweaver)",
            },
            signal: AbortSignal.timeout(30000),
          });
          if (!response.ok) {
            console.error("Wraeclast Cards response:", JSON.stringify({
              status: response.status,
              server: response.headers.get("server"),
              mitigation: response.headers.get("cf-mitigated"),
              ray: response.headers.get("cf-ray"),
              body: (await response.text()).slice(0, 500),
            }));
            throw new Error(`Wraeclast Cards index request failed: ${response.status}`);
          }
          const index = await response.json();
          const leagues = index.games?.poe1?.leagues;
          if (!Array.isArray(leagues)) throw new Error("Wraeclast Cards index is missing PoE 1 leagues");
          const active = leagues.filter((league) => league.historical === false);
          if (active.length === 0) {
            console.log("No active PoE 1 league; skipping the daily release.");
            process.exit(0);
          }
          if (active.length !== 1) throw new Error(`Expected one active PoE 1 league; found ${active.length}`);
          const { name } = active[0];
          if (typeof name !== "string" || !name.trim() || /[\r\n]/.test(name)) {
            throw new Error("Wraeclast Cards returned an invalid league name");
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `name=${name}\n`);
          console.log(`Updating weights for ${name}`);
          NODE

      - name: Install dependencies
        if: steps.league.outputs.name != ''
        run: pnpm install --frozen-lockfile

      - name: Update weights
        if: steps.league.outputs.name != ''
        env:
          LEAGUE: ${{ steps.league.outputs.name }}
        run: pnpm weights:poe1 --league "$LEAGUE"

      - name: Commit the daily update
        id: commit
        if: steps.league.outputs.name != ''
        env:
          LEAGUE: ${{ steps.league.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "packages/poe1-divination-cards/data/cards.json" "packages/poe1-divination-cards/data/cards-${LEAGUE}.json"
          git commit --allow-empty -m "fix(data,poe1): $(date -u +%m/%d/%Y)"
          git push origin HEAD:main
          echo "release=true" >> "$GITHUB_OUTPUT"

  release:
    needs: update
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.update.outputs.release == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
